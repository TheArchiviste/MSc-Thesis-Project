# One isolated Joern worker for the synchronous pipeline. Add explicitly
# configured workers only when the caller also shards work across endpoints.

services:
  joern:
    image: ghcr.io/joernio/joern:v4.0.0
    container_name: llmxcpg_joern
    init: true
    working_dir: /workspace
    command: >
      joern --server --server-host 0.0.0.0 --server-port 8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - joern_workspace:/workspace
      # `Config.work_dir/joern-inputs` maps to `JoernConfig.server_input_dir`.
      - ../work/joern-inputs:/analysis/inputs:ro

volumes:
  joern_workspace:
