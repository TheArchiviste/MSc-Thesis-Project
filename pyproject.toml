[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxcpg"
version = "0.1.0"
description = "Context-aware vulnerability detection via CPG-guided LLMs (Lekssays et al., USENIX Security 2025)."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "LLMxCPG reimplementation"}
]
dependencies = [
    # Joern integration
    "cpgqls-client>=0.0.5",        # WebSocket client for Joern's server mode
    "websocket-client>=1.6.0",
    "numpy",
]

[project.optional-dependencies]
inference = [
    "vllm>=0.6.0",
    "transformers>=4.45.0",
    "torch>=2.4.0",
    "accelerate>=0.34.0",
    "peft>=0.13.0",
    "openai>=1.40.0",
]
training = [
    "transformers>=4.45.0",
    "torch>=2.4.0",
    "accelerate>=0.34.0",
    "peft>=0.13.0",
    "datasets>=3.0.0",
    "bitsandbytes>=0.44.0",
]
bootstrap = ["openai>=1.40.0"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
llmxcpg = "llmxcpg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmxcpg*", "evidence_experiment*"]

[tool.ruff]
line-length = 100
target-version = "py310"
