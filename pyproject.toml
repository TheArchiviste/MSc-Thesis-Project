[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxcpg"
version = "0.2.0"
description = "RQ1 source-grounded adequacy audit of pretrained Q and Joern excerpts."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
dependencies = ["cpgqls-client==0.0.9", "websocket-client==1.9.2", "websockets==17.3", "requests==2.34.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff"]

[project.scripts]
llmxcpg = "evidence_experiment.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmxcpg*", "evidence_experiment*", "rq1*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
