[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmxcpg"
version = "0.1.0"
description = "Context-aware vulnerability detection via CPG-guided LLMs (Lekssays et al., USENIX Security 2025)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "LLMxCPG reimplementation"}
]
dependencies = [
    # Joern integration
    "cpgqls-client>=0.0.5",        # WebSocket client for Joern's server mode
    "websocket-client>=1.6.0",
    # LLM inference
    "vllm>=0.6.0",                 # Q-model inference (paper §4.2)
    "transformers>=4.45.0",
    "torch>=2.4.0",
    "accelerate>=0.34.0",
    "peft>=0.13.0",                # LoRA adapters for inference
    "unsloth>=2024.10",             # D-model inference (paper §4.2). Optional.
    # Training (optional, see configs/llamafactory)
    "datasets>=3.0.0",
    "bitsandbytes>=0.44.0",
    # Bootstrap loop calls DeepSeek API
    "openai>=1.40.0",
    # Data prep / parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    # Misc
    "pydantic>=2.0",
    "tqdm",
    "numpy",
    "scikit-learn",
    "click",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
llmxcpg = "llmxcpg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmxcpg*"]
