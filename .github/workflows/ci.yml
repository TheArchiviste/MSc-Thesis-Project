name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check .
      - run: python -m compileall -q llmxcpg evidence_experiment juliet_pilot scripts tests
      - run: bash -n scripts/myriad/run.sh scripts/myriad/prepare.sge scripts/myriad/gpu.sge scripts/myriad/cpu.sge
