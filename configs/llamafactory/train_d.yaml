# LLaMA-Factory config for fine-tuning LLMxCPG-D.
# Run: llamafactory-cli train configs/llamafactory/train_d.yaml
#
# Same LoRA hyperparameters as Q. Difference: a smaller `cutoff_len` because
# slices are far shorter than raw functions, and a different base model
# (QwQ-32B-Preview chosen per Appendix B of the paper).

### Model
model_name_or_path: Qwen/QwQ-32B-Preview
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 4
lora_dropout: 0.0

### Dataset
dataset: llmxcpg_d              # register data/d_train.jsonl as "llmxcpg_d" in dataset_info.json
template: qwen
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 16

### Output
output_dir: checkpoints/llmxcpg-d
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### Train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
